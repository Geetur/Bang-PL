name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint (Ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (lexer, parser, semantic, evaluator, regressions)
        run: pytest -q
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: always()